packages:
  - "packages/*"
  - "infra"

# Transitive security pins for blocking `pnpm audit --prod --audit-level=high`
overrides:
  "fast-uri@^3": "3.1.5"
  "fast-uri@^4": "4.1.2"
  "nanoid@^3": "3.3.18"
  "postcss@^8": "8.5.18"
  deepmerge-ts: "8.0.0"
  find-my-way: "9.7.0"
  effect: "3.20.0"
  "@playwright/test": "1.55.1"
  playwright: "1.55.1"
  playwright-core: "1.55.1"
  sharp: "0.35.0"

allowBuilds:
  esbuild: true
  sharp: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true

catalog:
  next: 16.2.11
  react: 19.2.8
  react-dom: 19.2.8
  typescript: 5.9.3
  tsx: 4.23.1
  zod: 4.4.3
  fastify: 5.10.0
  better-auth: 1.6.23
  "@fastify/cookie": 11.0.2
  "@fastify/cors": 11.2.0
  "@fastify/helmet": 13.0.2
  "@fastify/rate-limit": 11.1.0
  "@fastify/sensible": 6.0.4
  pino: 10.3.1
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  pg: 8.22.0
  "@types/pg": 8.20.0
  pg-boss: 12.26.2
  "@types/node": 22.20.1
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3

minimumReleaseAgeExclude:
  - '@next/env@16.2.11'
  - '@next/swc-darwin-arm64@16.2.11'
  - '@next/swc-darwin-x64@16.2.11'
  - '@next/swc-linux-arm64-gnu@16.2.11'
  - '@next/swc-linux-arm64-musl@16.2.11'
  - '@next/swc-linux-x64-gnu@16.2.11'
  - '@next/swc-linux-x64-musl@16.2.11'
  - '@next/swc-win32-arm64-msvc@16.2.11'
  - '@next/swc-win32-x64-msvc@16.2.11'
  - next@16.2.11
  - react-dom@19.2.8
  - react@19.2.8
  - pg-boss@12.26.2

strictPeerDependencies: true
