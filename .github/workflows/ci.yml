name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "plans/**", ".cursor/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "plans/**", ".cursor/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # depth=1 breaks private submodule SHA checkout ("not our ref")
          fetch-depth: 0
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python for contract-check
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install jsonschema

      # validate.sh runs the identity guardrail, contract checks, typecheck, tests, infra CDK and build.
      - name: Validate
        run: SKIP_E2E=1 pnpm validate

      # Phase K: blocking dependency audit - triage findings (fix or exception-with-expiry).
      - name: npm audit (blocking)
        run: pnpm audit --prod --audit-level=high

  sbom:
    name: SBOM (Syft stub)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
          upload-artifact-retention: 14

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stamped
          POSTGRES_PASSWORD: stamped
          POSTGRES_DB: stamped_l6_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stamped -d stamped_l6_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://stamped:stamped@localhost:5432/stamped_l6_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # depth=1 breaks private submodule SHA checkout ("not our ref")
          fetch-depth: 0
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm test:integration

      - name: BFF smoke
        run: pnpm smoke:bff
