[program:l4-api]
command=/usr/local/bin/stamped-stub-process l4-api 8000
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=45
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/l4-api.log
stderr_logfile=/var/log/supervisor/l4-api.err
priority=40

[program:l4-worker]
command=/usr/local/bin/stamped-stub-process l4-worker 0
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=60
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/l4-worker.log
stderr_logfile=/var/log/supervisor/l4-worker.err
priority=41
