[program:l1-cloud-ingest]
command=/usr/local/bin/stamped-stub-process l1-cloud-ingest 8090
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=30
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/l1-cloud-ingest.log
stderr_logfile=/var/log/supervisor/l1-cloud-ingest.err
priority=10
