[program:l2-query-api]
command=/usr/local/bin/stamped-stub-process l2-query-api 8091
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=30
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/l2-query-api.log
stderr_logfile=/var/log/supervisor/l2-query-api.err
priority=25
