[program:l3-scheduler]
command=/usr/local/bin/stamped-stub-process l3-scheduler 0
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=45
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/l3-scheduler.log
stderr_logfile=/var/log/supervisor/l3-scheduler.err
priority=30
# Memory cap applied on the host via systemd MemoryMax / cgroup (see deploy/host/)
